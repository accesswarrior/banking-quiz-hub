<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Werewolf - School Game</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="app">
    <!-- Loading screen -->
    <div class="screen active" id="loading-screen">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <!-- Authentication screen -->
    <div class="screen" id="auth-screen">
      <div class="auth-card">
        <h1 class="game-title">🐺 Werewolf</h1>
        <p class="tagline">The classic social deduction game</p>
        
        <div class="auth-form">
          <input type="text" id="username" placeholder="Username" autocomplete="off">
          <input type="password" id="pin" placeholder="4-digit PIN" maxlength="4" inputmode="numeric" pattern="[0-9]*">
          
          <button id="login-btn" class="primary-btn">Login</button>
          <button id="signup-btn" class="secondary-btn">Sign Up</button>
          
          <p id="auth-error" class="error-message"></p>
        </div>
      </div>
    </div>

    <!-- Lobby screen (empty for now) -->
    <div class="screen" id="lobby-screen">
      <div class="lobby-container">
        <h2>Game Lobby</h2>
        <button id="logout-btn" class="secondary-btn">Logout</button>
      </div>
    </div>

    <!-- Role reveal screen (empty for now) -->
    <div class="screen" id="role-screen">
      <div class="role-container">
        <h2>Your Role</h2>
        <div id="role-content"></div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <!-- Core scripts -->
  <script src="js/core/firebaseConfig.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
